# PicoCalc boot defaults (sourced by /etc/rc.local)
#
# Backlight settings are in percent (0-100).

LCD_BACKLIGHT=70
KBD_BACKLIGHT=30

# I2C poll config (microseconds)
KBD_POLL_US=5000
STATUS_POLL_US=250000
BACKOFF_MIN_US=5000
BACKOFF_MAX_US=500000
FIFO_MAX=8

# Optional status daemon (writes a one-line summary to /tmp/picocalc.status)
PICOCALCD=1
PICOCALCD_INTERVAL=1
PICOCALCD_OUT=/tmp/picocalc.status

